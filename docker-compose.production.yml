services:
  postgres:
    image: tracelore-postgres:local
    build: {context: infra/postgres/production}
    volumes:
      - walarchive:/wal-archive
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=UTC
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - 'archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
volumes:
  walarchive: {}
