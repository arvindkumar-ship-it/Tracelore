global: {scrape_interval: 10s, evaluation_interval: 10s}
rule_files: [alerts.yml]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:8000']}]
  - job_name: ingest
    dns_sd_configs: [{names: [ingest], type: A, port: 8001}]
  - job_name: workers
    static_configs: [{targets: ['workers:9100']}]
  - job_name: detector
    static_configs: [{targets: ['detector:9101']}]
