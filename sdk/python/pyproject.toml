[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelore-sdk"
version = "0.1.0"
description = "Nonblocking, hash-chained observed-event capture"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
sqlalchemy = ["sqlalchemy>=2,<3"]
asyncpg = ["asyncpg>=0.30,<1"]
redis = ["redis>=5,<8"]

[tool.setuptools.packages.find]
include = ["tracelore*"]

[tool.setuptools.package-data]
tracelore = ["py.typed"]

