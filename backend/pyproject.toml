[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelore-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "tracelore-sdk==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "asyncpg>=0.30,<1",
  "aiokafka>=0.12,<1", "redis>=5,<8", "numpy>=2,<3", "pandas>=2.2,<3",
  "statsmodels>=0.15,<0.16", "scipy>=1.14,<2", "pyarrow>=19,<24",
  "zstandard>=0.23,<1", "boto3>=1.36,<2", "openai>=1.60,<3",
  "litellm>=1.60,<2", "prometheus-client>=0.21,<1", "PyYAML>=6,<7",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "sentence-transformers>=3.4,<6"]
dev = ["ruff>=0.11", "mypy>=1.15", "pytest>=8,<10", "pytest-asyncio>=0.25", "hypothesis>=6", "asyncpg-stubs", "types-PyYAML"]

[tool.setuptools]
package-dir = {backend = "."}
packages = ["backend", "backend.common", "backend.ledger", "backend.ingest", "backend.replay", "backend.api", "backend.api.routers", "backend.workers", "backend.ml", "backend.ml.baseline", "backend.ml.anomaly", "backend.ml.causal", "backend.ml.counterfactual", "backend.ml.compression"]

[tool.setuptools.package-data]
backend = ["ledger/migrations/*.sql"]

