[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dashboard", "sdk/typescript"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"bench/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["sdk/python", "."]
explicit_package_bases = true
exclude = ["tests", "bench", ".venv"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "statsmodels.*", "pyarrow.*", "scipy.*", "boto3.*", "botocore.*", "prometheus_client.*", "sentence_transformers.*", "onnxruntime.*", "litellm.*", "torch.*", "pandas.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
markers = ["ml: optional neural models and ONNX runtime","unit: pure logic and local transport", "integration: real infrastructure", "load: measured performance gates"]
filterwarnings = ["error", "ignore:.*enable_nested_tensor.*:UserWarning"]

