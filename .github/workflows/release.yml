name: Release
on: {push: {tags: ['v*']}}
permissions: {contents: read, packages: write, id-token: write}
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/backend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/dashboard:${{ github.ref_name }}
  sdks:
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install build && python -m build sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: sdk/python/dist/}
      - uses: actions/setup-node@v4
        with: {node-version: '22', registry-url: 'https://registry.npmjs.org'}
      - working-directory: sdk/typescript
        run: npm ci && npm run build && npm publish --access public
        env: {NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'}
